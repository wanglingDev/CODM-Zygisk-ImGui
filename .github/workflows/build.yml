name: Build CODM Garena Zygisk Module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Install a specific NDK + CMake so the build is reproducible and never
    # hits the "CMake 3.18.1 not found" NullPointerException.
    - name: Install NDK and CMake
      run: |
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;25.2.9519653" \
          "cmake;3.22.1"

    - name: Build Release
      run: |
        chmod +x ./gradlew
        ./gradlew :module:zipRelease

    - name: Upload Zygisk Module
      uses: actions/upload-artifact@v4
      with:
        name: CODM-Garena-Zygisk-Module
        path: out/*.zip
